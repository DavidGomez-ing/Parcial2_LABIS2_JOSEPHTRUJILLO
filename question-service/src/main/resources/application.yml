server:
  port: 8083
spring:
  application:
    name: question-service
  datasource:
    url: jdbc:h2:mem:questiondb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

validation:
  url: http://localhost:8082/validate
